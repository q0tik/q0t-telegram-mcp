[project]
name = "q0t-telegram-mcp"
version = "0.11.0"
description = "Telegram MCP server that actually sends messages"
requires-python = ">=3.12"
# Pinned exactly, not floored. 0.9.0 shipped `mcp>=1.0.0` and mcp 2.0 removed
# `mcp.server.fastmcp` — every fresh install died at import while the test suite,
# running against uv.lock, stayed green. A range is a promise about code that
# does not exist yet; these are the versions this release was actually tested
# on. Raising one is a deliberate edit plus a test run, which is the point.
dependencies = [
    "click==8.4.2",
    # 2.x: FastMCP is now MCPServer in mcp.server.mcpserver, and host/port/
    # transport_security moved off `settings` onto the app factories.
    "mcp==2.0.0",
    # 1.44.0 (TL layer 227): earlier layers raise TypeNotFoundError on the
    # Dialog constructor (0xfc89f7f3) that Telegram now returns from getDialogs.
    "telethon==1.44.0",
    # Driven directly in HTTP mode so logging can go to stderr; imported by name
    # in _serve_http, so it is a real dependency of ours, not just mcp's.
    "uvicorn==0.52.1",
]

[project.scripts]
q0t-telegram-mcp = "tg_mcp:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_mcp"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ignores are conventions this codebase holds on purpose, not debt:
ignore = [
    # Optional[X] over X | None in tool signatures is load-bearing. Some MCP
    # clients render `X | None` as an anyOf they then report as type "unknown";
    # the Optional + WithJsonSchema pairing is what fixed that.
    "UP007", "UP045",
    # Tools catch bare Exception on purpose: a tool error must come back as
    # {"error": ...} for the model to read, not kill the MCP session.
    "BLE001",
    # EnvironmentError is the documented name in docs/architecture.md and what
    # the tests match on. It is an alias of OSError; renaming buys nothing.
    "UP024",
    # Stacked patch() context managers read better nested than joined.
    "SIM117",
    # One deliberate try/except/pass, explained at the site: a noisy disconnect
    # must not downgrade an already-answered check.
    "S110",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["tg_mcp"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
