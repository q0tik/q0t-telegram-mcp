[project]
name = "q0t-telegram-mcp"
version = "0.3.0"
description = "Telegram MCP server that actually sends messages"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0.0",
    "mcp>=1.0.0",
    "telethon>=1.36.0",
]

[project.scripts]
q0t-telegram-mcp = "tg_mcp:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["tg_mcp"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
